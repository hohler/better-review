name: Windows build

# Builds the Windows installer. Run it by hand for a test build, or publish a release and it attaches the installer.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: better-review-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: github.event_name == 'release'
        run: gh release upload $env:TAG (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
